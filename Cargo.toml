[package]
name = "flowlite"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
askama = "0.16.0"
axum = "0.8.9"
clap = { version = "4.6.1", features = ["derive", "env"] }
figment = { version = "0.10.19", features = ["toml", "env"] }
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "migrate", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52.3", features = ["full"] }
argon2 = { version = "0.5.3", features = ["std", "password-hash"] }
rand = "0.8.5"
uuid = { version = "1.10.0", features = ["v4"] }
sha2 = "0.10.8"
serde_yaml = "0.9.34"
rust-embed = "8.6.0"
mime_guess = "2.0.5"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
validator = { version = "0.20.0", features = ["derive"] }
cron = { version = "0.17.0", features = ["serde"] }
libc = "0.2.186"
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "builder", "tokio1-rustls-tls"] }
# rustls-no-provider, plus ring below, so the tree keeps the one crypto provider lettre
# already brings rather than also building aws-lc-rs and its C toolchain.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "http2"] }
rustls = { version = "0.23.44", default-features = false, features = ["ring", "std", "tls12", "logging"] }

[dev-dependencies]
tokio = { version = "1.52.3", features = ["test-util"] }
libc = "0.2.186"
uuid = { version = "1.10.0", features = ["v4"] }
