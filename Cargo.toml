[package]
name = "flowlite"
version = "0.1.0"
edition = "2024"
# The LICENSE file, the README and THIRD_PARTY_LICENSES.md all say Zero-Clause BSD. This is
# the one place a machine reads it.
license = "0BSD"

[dependencies]
anyhow = "1.0.102"
askama = "0.16.0"
axum = "0.8.9"
clap = { version = "4.6.1", features = ["derive", "env"] }
figment = { version = "0.10.19", features = ["toml", "env"] }
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "migrate", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# What this crate's own code uses, named rather than taken wholesale as "full": macros is
# #[tokio::main]/#[tokio::test] and select!; rt-multi-thread the runtime those start; sync
# the Notify and Mutex the pollers and AppState hold; time the poll interval, the attempt
# timeout and every wait; process the command a task run spawns; net axum's listener;
# signal the shutdown handler; io-util the AsyncRead the output readers are generic over.
#
# This is a statement of what flowlite needs, not of what gets compiled. Cargo unions
# features across the graph, so `fs` still arrives through rmcp's transport-io tree and
# `io-std` through transport-io itself, and `tokio::fs` would go on compiling here today.
# The list is what stays true if those dependencies change - and the one thing "full"
# actually added on its own, tokio's parking_lot, sqlx pulls in anyway.
tokio = { version = "1.52.3", features = [
    "macros", "rt-multi-thread", "sync", "time", "process", "net", "signal", "io-util",
] }
uuid = { version = "1.10.0", features = ["v4"] }
serde_yaml = "0.9.34"
rust-embed = "8.6.0"
mime_guess = "2.0.5"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
validator = { version = "0.20.0", features = ["derive"] }
cron = { version = "0.17.0", features = ["serde"] }
libc = "0.2.186"
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "builder", "tokio1-rustls-tls"] }
# rustls-no-provider, plus ring below, so the tree keeps the one crypto provider lettre
# already brings rather than also building aws-lc-rs and its C toolchain.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "http2"] }
rustls = { version = "0.23.44", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# default-features = false drops `base64`, which nothing here encodes: the stdio server
# needs `server` (the tool system, which pulls schemars), `macros` (tool schemas derived
# from the argument structs) and `transport-io` (stdin/stdout). None of the HTTP or auth
# features are on, so this adds no TLS provider and no HTTP client to the tree.
rmcp = { version = "3.3.0", default-features = false, features = ["server", "macros", "transport-io"] }

[dev-dependencies]
tokio = { version = "1.52.3", features = ["test-util"] }
